name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check the release tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$GITHUB_REF_NAME" = "v$(python3 build.py --version)"

      - name: Build trilium-fsrs.zip (fetches the latest ts-fsrs)
        run: python3 build.py

      - name: Check the scripts parse
        run: |
          node --check src/review.js
          node --check src/optimizer.js

      - name: Check the optimizer against the fetched ts-fsrs
        run: node tests/model-check.cjs

      - name: Verify the archive layout
        run: |
          python3 - <<'PY'
          import json, zipfile
          z = zipfile.ZipFile('trilium-fsrs.zip')
          meta = json.loads(z.read('!!!meta.json'))
          names = set(z.namelist())
          def check(note, prefix=''):
              path = prefix + note['dataFileName']
              assert path in names, f'missing {path}'
              print('ok', path)
              for child in note.get('children', []):
                  check(child, prefix + note['dirFileName'] + '/')
          root = meta['files'][0]
          assert root['title'] == 'Flashcards' and root['type'] == 'render'
          assert any(a['name'] == 'renderNote' for a in root['attributes'])
          check(root)
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: trilium-fsrs
          path: trilium-fsrs.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: trilium-fsrs
      - uses: softprops/action-gh-release@v3
        with:
          files: trilium-fsrs.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'rc') }}
